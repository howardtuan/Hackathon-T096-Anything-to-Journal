<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" role="img" aria-labelledby="title desc">
  <title id="title">Anything to Journal 系統架構</title>
  <desc id="desc">從研究素材、格式確認、安全盤點、AI Agent 整理稿件，到建置、稽核、本機編輯及最終交付的五階段流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#526175"/>
    </marker>
    <style>
      .stage { fill: #ffffff; stroke: #cbd7e6; stroke-width: 3; }
      .subbox { fill: #f7f9fc; stroke: #cbd7e6; stroke-width: 2; }
      .title { font: 700 42px system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 24px system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #526175; }
      .stage-title { font: 700 31px system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #172033; }
      .body { font: 500 24px system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #27364a; }
      .small { font: 400 21px system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #526175; }
      .code { font: 600 20px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #34455c; }
      .number { font: 700 27px system-ui, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke: #526175; stroke-width: 4; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #526175; stroke-width: 4; }
      .note { font: 600 20px system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #526175; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="1640" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" class="title">Anything to Journal 系統架構</text>
  <text x="600" y="103" text-anchor="middle" class="subtitle">AI 負責語意整合；Python 負責可重現的建置、追蹤與品質閘門</text>

  <!-- 1. Input -->
  <rect x="100" y="140" width="1000" height="150" rx="22" class="stage"/>
  <rect x="100" y="140" width="14" height="150" rx="7" fill="#1d6fdc"/>
  <circle cx="165" cy="215" r="31" fill="#1d6fdc"/>
  <text x="165" y="216" class="number">1</text>
  <text x="220" y="196" class="stage-title">研究者放入完整素材</text>
  <text x="220" y="239" class="body">PDF、DOCX、試算表、資料集、圖片、程式碼、筆記與官方模板</text>
  <text x="220" y="270" class="small">一篇論文使用一個全新素材資料夾；輸入檔一律視為不受信任</text>

  <path d="M 600 290 L 600 330" class="arrow"/>

  <!-- 2. Prepare -->
  <rect x="100" y="340" width="1000" height="190" rx="22" class="stage"/>
  <rect x="100" y="340" width="14" height="190" rx="7" fill="#c16a14"/>
  <circle cx="165" cy="435" r="31" fill="#c16a14"/>
  <text x="165" y="436" class="number">2</text>
  <text x="220" y="391" class="stage-title">格式確認與安全盤點</text>
  <text x="220" y="433" class="body">先由作者選擇「通用草稿」或指定期刊／研討會格式</text>
  <text x="220" y="472" class="code">prepare_workspace.py</text>
  <text x="535" y="472" class="small">安全複製、不執行輸入、拒絕 symlink 與危險路徑</text>
  <text x="220" y="506" class="small">輸出：不可變素材副本、source-manifest.json、穩定來源 ID、SHA-256</text>

  <path d="M 600 530 L 600 570" class="arrow"/>

  <!-- 3. Agent -->
  <rect x="100" y="580" width="1000" height="250" rx="22" class="stage"/>
  <rect x="100" y="580" width="14" height="250" rx="7" fill="#5b4bd8"/>
  <circle cx="165" cy="705" r="31" fill="#5b4bd8"/>
  <text x="165" y="706" class="number">3</text>
  <text x="220" y="631" class="stage-title">AI Agent 語意處理層</text>

  <rect x="220" y="663" width="245" height="112" rx="14" class="subbox"/>
  <text x="342" y="707" text-anchor="middle" class="body">Codex／相容</text>
  <text x="342" y="741" text-anchor="middle" class="small">Agent Runtime</text>

  <path d="M 465 719 L 505 719" class="arrow"/>

  <rect x="520" y="663" width="235" height="112" rx="14" class="subbox"/>
  <text x="637" y="707" text-anchor="middle" class="body">SKILL.md</text>
  <text x="637" y="741" text-anchor="middle" class="small">工作流與規則</text>

  <path d="M 755 719 L 795 719" class="arrow"/>

  <rect x="810" y="663" width="245" height="112" rx="14" class="subbox"/>
  <text x="932" y="699" text-anchor="middle" class="body">逐檔審閱</text>
  <text x="932" y="733" text-anchor="middle" class="small">證據整合、撰寫</text>
  <text x="932" y="761" text-anchor="middle" class="small">詢問作者決策</text>
  <text x="600" y="810" text-anchor="middle" class="small">模型不寫死在程式碼中；關鍵作者、倫理與投稿決策仍由人類確認</text>

  <path d="M 600 830 L 600 870" class="arrow"/>

  <!-- 4. Manuscript state -->
  <rect x="100" y="880" width="1000" height="170" rx="22" class="stage"/>
  <rect x="100" y="880" width="14" height="170" rx="7" fill="#178357"/>
  <circle cx="165" cy="965" r="31" fill="#178357"/>
  <text x="165" y="966" class="number">4</text>
  <text x="220" y="931" class="stage-title">可編輯、可追蹤的稿件狀態</text>
  <text x="220" y="974" class="code">manuscript.tex　 references.bib　 traceability.csv　 evidence-map.csv</text>
  <text x="220" y="1013" class="small">無中央資料庫：狀態保存在本機 JSON、CSV、Markdown 與檔案雜湊，可攜且可版控</text>

  <!-- Split to three deterministic paths -->
  <path d="M 600 1050 L 600 1090" class="branch"/>
  <path d="M 210 1090 L 990 1090" class="branch"/>
  <path d="M 210 1090 L 210 1120" class="arrow"/>
  <path d="M 600 1090 L 600 1120" class="arrow"/>
  <path d="M 990 1090 L 990 1120" class="arrow"/>

  <!-- Build -->
  <rect x="55" y="1130" width="310" height="245" rx="20" class="stage"/>
  <rect x="55" y="1130" width="310" height="12" rx="6" fill="#1d6fdc"/>
  <text x="210" y="1192" text-anchor="middle" class="stage-title">Build</text>
  <text x="210" y="1233" text-anchor="middle" class="code">build.py</text>
  <text x="210" y="1274" text-anchor="middle" class="body">Tectonic／XeLaTeX</text>
  <text x="210" y="1307" text-anchor="middle" class="small">／pdfLaTeX</text>
  <text x="210" y="1347" text-anchor="middle" class="small">PDF、Overleaf ZIP</text>

  <!-- Audit -->
  <rect x="445" y="1130" width="310" height="245" rx="20" class="stage"/>
  <rect x="445" y="1130" width="310" height="12" rx="6" fill="#c16a14"/>
  <text x="600" y="1192" text-anchor="middle" class="stage-title">Audit</text>
  <text x="600" y="1233" text-anchor="middle" class="code">audit.py</text>
  <text x="600" y="1274" text-anchor="middle" class="body">來源 × 稿件 × PDF</text>
  <text x="600" y="1310" text-anchor="middle" class="small">引用、數值、雜湊、頁數</text>
  <text x="600" y="1347" text-anchor="middle" class="small">品質報告、提交封裝</text>

  <!-- Workspace -->
  <rect x="835" y="1130" width="310" height="245" rx="20" class="stage"/>
  <rect x="835" y="1130" width="310" height="12" rx="6" fill="#5b4bd8"/>
  <text x="990" y="1192" text-anchor="middle" class="stage-title">Workspace</text>
  <text x="990" y="1233" text-anchor="middle" class="code">workspace_editor.py</text>
  <text x="990" y="1274" text-anchor="middle" class="body">localhost 瀏覽器</text>
  <text x="990" y="1310" text-anchor="middle" class="small">PDF 預覽 ↔ LaTeX 編輯</text>
  <text x="990" y="1347" text-anchor="middle" class="small">儲存後重新預覽編譯</text>

  <!-- Merge -->
  <path d="M 210 1375 L 210 1415 L 600 1415" class="branch"/>
  <path d="M 600 1375 L 600 1440" class="arrow"/>
  <path d="M 990 1375 L 990 1415 L 600 1415" class="branch"/>

  <!-- 5. Deliverables -->
  <rect x="100" y="1450" width="1000" height="135" rx="22" fill="#eef8f3" stroke="#83bea3" stroke-width="3"/>
  <circle cx="165" cy="1517" r="31" fill="#178357"/>
  <text x="165" y="1518" class="number">5</text>
  <text x="220" y="1506" class="stage-title">作者可審閱的最終交付</text>
  <text x="220" y="1549" class="body">LaTeX 原始檔 ＋ PDF ＋ Overleaf ZIP ＋ 品質報告 ＋ submission-package.zip</text>

  <text x="600" y="1620" class="note">安全邊界：本機 Workspace 只綁定 127.0.0.1；不自行上傳稿件；LaTeX 停用 shell escape</text>
</svg>
